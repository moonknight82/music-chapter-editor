[package]
name = "music-chapter-editor"
version = "0.1.0"
description = "A focused Matroska chapter editor with MusicBrainz lookup"
authors = ["Music Chapter Editor contributors"]
license = "MIT"
repository = "https://github.com/moonknight82/music-chapter-editor"
edition = "2024"
rust-version = "1.85"

[lib]
name = "music_chapter_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xmltree = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time"] }
tempfile = "3"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
thiserror = "2"
rand = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
pretty_assertions = "1"
